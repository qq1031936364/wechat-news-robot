name: 整点资讯推送
on:
  schedule:
    # 北京时间：9、10、11 /13、14、15 /19、20、21 整点执行
    - cron: '0 1,2,3,5,6,7,11,12,13 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install requests
      - name: 运行资讯播报
        run: python main.py
